<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" width="100%" height="100%" style="max-width:1020px;display:block;margin:0 auto">
  <defs>
    <style>
      /* ==========================================================
         DUAL-THEME SVG — adapts to the host's color scheme
         ========================================================== */
      :root {
        --bg: #f8fafc;
        --grid: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --text-dim: #94a3b8;
        --mask: #ffffff;

        --arrow: #94a3b8;
        --arrow-emphasis: #059669;

        --frontend-fill:    rgba(34, 211, 238, 0.15);
        --frontend-stroke:  #0891b2;
        --backend-fill:     rgba(52, 211, 153, 0.18);
        --backend-stroke:   #059669;
        --platform-fill:    rgba(148, 163, 184, 0.18);
        --platform-stroke:  #64748b;
        --external-fill:    rgba(148, 163, 184, 0.18);
        --external-stroke:  #64748b;

        --region-stroke:    #94a3b8;
        --region-fill:      rgba(148, 163, 184, 0.04);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --grid: #1e293b;
          --text: #ffffff;
          --text-muted: #94a3b8;
          --text-dim: #475569;
          --mask: #0f172a;

          --arrow: #64748b;
          --arrow-emphasis: #34d399;

          --frontend-fill:    rgba(8, 51, 68, 0.4);
          --frontend-stroke:  #22d3ee;
          --backend-fill:     rgba(6, 78, 59, 0.4);
          --backend-stroke:   #34d399;
          --platform-fill:    rgba(30, 41, 59, 0.5);
          --platform-stroke:  #94a3b8;
          --external-fill:    rgba(30, 41, 59, 0.5);
          --external-stroke:  #94a3b8;

          --region-stroke:    #475569;
          --region-fill:      rgba(71, 85, 105, 0.04);
        }
      }

      .c-mask        { fill: var(--mask); stroke: none; }
      .c-frontend    { fill: var(--frontend-fill);   stroke: var(--frontend-stroke); }
      .c-backend     { fill: var(--backend-fill);    stroke: var(--backend-stroke); }
      .c-platform    { fill: var(--platform-fill);   stroke: var(--platform-stroke); }
      .c-external    { fill: var(--external-fill);   stroke: var(--external-stroke); }
      .c-region      { fill: var(--region-fill);     stroke: var(--region-stroke); stroke-dasharray: 6 3; }

      .t-primary     { fill: var(--text); }
      .t-muted       { fill: var(--text-muted); }
      .t-backend     { fill: var(--backend-stroke); }
      .t-platform    { fill: var(--platform-stroke); }
      .t-external    { fill: var(--external-stroke); }
      .t-messagebus  { fill: var(--external-stroke); }

      .c-grid        { stroke: var(--grid); }

      .m-default     { fill: var(--arrow); }
      .m-emphasis    { fill: var(--arrow-emphasis); }
      .m-dashed      { fill: var(--arrow); }

      .a-default     { fill: none; stroke: var(--arrow); }
      .a-emphasis    { fill: none; stroke: var(--arrow-emphasis); }
      .a-dashed      { fill: none; stroke: var(--arrow); stroke-dasharray: 4 3; }

      text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
    </marker>
    <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="var(--bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Boundaries -->
  <rect x="250" y="190" width="520" height="440" rx="12" class="c-region" stroke-width="1"/>
  <text x="258" y="208" class="t-platform" font-size="9" font-weight="600">LyricsTaskbar.exe (C++ Win32 Process)</text>

  <rect x="10" y="190" width="770" height="290" rx="12" class="c-region" stroke-width="1"/>
  <text x="18" y="208" class="t-platform" font-size="9" font-weight="600">Windows Desktop Environment</text>

  <!-- Connection paths (before components for correct z-order) -->
  <path d="M 280 250 L 180 250" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
  <path d="M 280 250 L 238 250 Q 230 250 230 258 L 230 422 Q 230 430 222 430 L 180 430" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
  <path d="M 370 400 L 370 280" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
  <path d="M 370 450 L 370 560" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 460 425 L 507 425 Q 515 425 515 417 L 515 258 Q 515 250 523 250 L 570 250" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
  <path d="M 750 250 L 840 250" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
  <path d="M 740 425 L 782 425 Q 790 425 790 433 L 790 582 Q 790 590 798 590 L 840 590" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
  <path d="M 655 560 L 655 450" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 570 585 L 523 585 Q 515 585 515 577 L 515 258 Q 515 250 507 250 L 460 250" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
  <path d="M 370 450 L 370 512 Q 370 520 378 520 L 832 520 Q 840 520 840 528 L 840 590" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>

  <!-- Components -->
  <rect x="40" y="220" width="140" height="60" rx="6" class="c-mask"/>
  <rect x="40" y="220" width="140" height="60" rx="6" class="c-platform" stroke-width="1.5"/>
  <text x="110" y="248" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Windows Taskbar</text>
  <text x="110" y="264" class="t-muted" font-size="9" text-anchor="middle">Shell_TrayWnd</text>

  <rect x="40" y="400" width="140" height="60" rx="6" class="c-mask"/>
  <rect x="40" y="400" width="140" height="60" rx="6" class="c-frontend" stroke-width="1.5"/>
  <text x="110" y="428" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Tray Notify Area</text>
  <text x="110" y="444" class="t-muted" font-size="9" text-anchor="middle">TrayNotifyWnd</text>

  <rect x="280" y="220" width="180" height="60" rx="6" class="c-mask"/>
  <rect x="280" y="220" width="180" height="60" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="370" y="248" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Lyrics Popup Window</text>
  <text x="370" y="264" class="t-muted" font-size="9" text-anchor="middle">Layered transparent popup</text>
  <text x="370" y="272" class="t-backend" font-size="7" text-anchor="middle">500x30px</text>

  <rect x="280" y="400" width="180" height="50" rx="6" class="c-mask"/>
  <rect x="280" y="400" width="180" height="50" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="370" y="423" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">WM_TIMER Loop</text>
  <text x="370" y="439" class="t-muted" font-size="9" text-anchor="middle">100ms polling interval</text>

  <rect x="280" y="560" width="180" height="50" rx="6" class="c-mask"/>
  <rect x="280" y="560" width="180" height="50" rx="6" class="c-platform" stroke-width="1.5"/>
  <text x="370" y="583" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">GDI Rendering</text>
  <text x="370" y="599" class="t-muted" font-size="9" text-anchor="middle">DrawTextW / FillRect</text>

  <rect x="570" y="220" width="180" height="60" rx="6" class="c-mask"/>
  <rect x="570" y="220" width="180" height="60" rx="6" class="c-external" stroke-width="1.5"/>
  <text x="660" y="248" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">WinRT Media Session</text>
  <text x="660" y="264" class="t-muted" font-size="9" text-anchor="middle">GlobalSystemMediaTransportControls</text>

  <rect x="570" y="400" width="170" height="50" rx="6" class="c-mask"/>
  <rect x="570" y="400" width="170" height="50" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="655" y="423" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">HTTP Fetcher</text>
  <text x="655" y="439" class="t-muted" font-size="9" text-anchor="middle">wininet</text>

  <rect x="570" y="560" width="170" height="50" rx="6" class="c-mask"/>
  <rect x="570" y="560" width="170" height="50" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="655" y="583" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">LRC Parser</text>
  <text x="655" y="599" class="t-muted" font-size="9" text-anchor="middle">[mm:ss.xx] regex matcher</text>

  <rect x="840" y="220" width="140" height="60" rx="6" class="c-mask"/>
  <rect x="840" y="220" width="140" height="60" rx="6" class="c-frontend" stroke-width="1.5"/>
  <text x="910" y="248" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Music Apps</text>
  <text x="910" y="264" class="t-muted" font-size="9" text-anchor="middle">Spotify / Chrome</text>

  <rect x="840" y="560" width="140" height="60" rx="6" class="c-mask"/>
  <rect x="840" y="560" width="140" height="60" rx="6" class="c-external" stroke-width="1.5"/>
  <text x="910" y="588" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">lrclib.net API</text>
  <text x="910" y="604" class="t-muted" font-size="9" text-anchor="middle">synced lyrics database</text>
  <text x="910" y="612" class="t-external" font-size="7" text-anchor="middle">REST API</text>

  <!-- Connection labels -->
  <rect x="198.6" y="244" width="62.8" height="14" rx="3" class="c-mask"/>
  <text x="230" y="254" class="t-backend" font-size="8" text-anchor="middle">overlays on</text>

  <rect x="172.2" y="346" width="115.6" height="14" rx="3" class="c-mask"/>
  <text x="230" y="356" class="t-messagebus" font-size="8" text-anchor="middle">positioned relative to</text>

  <rect x="381.6" y="283.5" width="206.8" height="14" rx="3" class="c-mask"/>
  <text x="485" y="293.5" class="t-backend" font-size="8" text-anchor="middle">GetCurrentSession + GetTimelineProperties</text>

  <rect x="770.8" y="230" width="48.4" height="14" rx="3" class="c-mask"/>
  <text x="795" y="240" class="t-messagebus" font-size="8" text-anchor="middle">controls</text>

  <rect x="720.2" y="505.5" width="139.6" height="14" rx="3" class="c-mask"/>
  <text x="790" y="515.5" class="t-backend" font-size="8" text-anchor="middle">GET /api/get?track=&amp;artist=</text>

  <!-- Legend -->
  <text x="40" y="691" class="t-primary" font-size="9" font-weight="600">Legend</text>
  <rect x="40" y="696" width="14" height="9" rx="2" class="c-frontend" stroke-width="1"/>
  <text x="60" y="704" class="t-muted" font-size="8">Frontend</text>
  <rect x="123" y="696" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
  <text x="143" y="704" class="t-muted" font-size="8">Backend</text>
  <rect x="221" y="696" width="14" height="9" rx="2" class="c-platform" stroke-width="1"/>
  <text x="241" y="704" class="t-muted" font-size="8">Platform</text>
  <rect x="307" y="696" width="14" height="9" rx="2" class="c-external" stroke-width="1"/>
  <text x="327" y="704" class="t-muted" font-size="8">External</text>
</svg>
